<!DOCTYPE html>
<html lang="sr-Latn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#10284a">

    <title>RK Obilić | Statistički centar</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef2f7;
            color: #10284a;
        }

        header {
            background: #10284a;
            color: white;
            padding: 30px 20px;
            text-align: center;
            border-bottom: 4px solid #3578bd;
        }

        header h1 {
            margin: 10px 0;
            font-size: 30px;
            letter-spacing: 2px;
        }

        header p {
            margin: 5px 0;
            color: #c8d8eb;
        }

        .season {
            display: inline-block;
            background: #ffffff20;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 13px;
            margin-top: 15px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            padding: 25px 20px;
        }

        .section-title {
            font-size: 20px;
            margin-bottom: 20px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        .card {
            background: white;
            border: 1px solid #dce4ee;
            border-radius: 12px;
            padding: 25px 15px;
            text-align: center;
            box-shadow: 0 3px 12px #10284a0c;
        }

        .card strong {
            display: block;
            font-size: 32px;
            margin-bottom: 8px;
        }

        .card span {
            font-size: 13px;
            color: #64748b;
        }

        .menu {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-top: 25px;
        }

        .menu-button {
            background: white;
            color: #10284a;
            border: 1px solid #dce4ee;
            border-radius: 12px;
            padding: 25px;
            text-align: left;
            cursor: pointer;
            font-family: inherit;
            transition: 0.2s;
        }

        .menu-button:hover {
            background: #e1ebf7;
            border-color: #3578bd;
        }

        .menu-button .icon {
            display: block;
            font-size: 30px;
            margin-bottom: 12px;
        }

        .menu-button h2 {
            margin: 0 0 8px;
            font-size: 20px;
        }

        .menu-button p {
            margin: 0;
            font-size: 14px;
            line-height: 1.5;
        }

        .primary {
            background: #10284a;
            color: white;
        }

        .primary:hover {
            background: #1c4275;
        }

        footer {
            padding: 30px 15px;
            text-align: center;
            font-size: 12px;
            color: #64748b;
        }

        @media (max-width: 600px) {

            .container {
                padding: 20px 12px;
            }

            .dashboard {
                gap: 8px;
            }

            .card {
                padding: 18px 5px;
            }

            .card strong {
                font-size: 26px;
            }

            .card span {
                font-size: 11px;
            }

            .menu {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            header h1 {
                font-size: 26px;
            }
        }
    </style>

<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#10284a">
<link rel="apple-touch-icon" href="icon-192.png">
</head>

<body>

    <header>
        <h1>RK OBILIĆ</h1>
        <p>STATISTIČKI CENTAR</p>
        <div class="season">
            SEZONA 2026/2027
        </div>
    </header>

    <main class="container">

        <h2 class="section-title">
            Pregled sezone
        </h2>

        <div class="dashboard">

            <div class="card">
                <strong>0</strong>
                <span>LICENCIRANI IGRAČI</span>
            </div>

            <div class="card">
                <strong>0</strong>
                <span>UTAKMICE</span>
            </div>

            <div class="card">
                <strong>0</strong>
                <span>POSTIGNUTI GOLOVI</span>
            </div>

        </div>

        <div class="menu">

            <button class="menu-button primary"
                onclick="openSection('Nova utakmica')">
                <span class="icon">🤾</span>
                <h2>Nova utakmica</h2>
                <p>Izbor sastava i vođenje statistike uživo.</p>
            </button>

            <button class="menu-button"
                onclick="openSection('Igrači')">
                <span class="icon">👥</span>
                <h2>Igrači</h2>
                <p>Baza licenciranih igrača za sezonu.</p>
            </button>

            <button class="menu-button"
                onclick="openSection('Utakmice')">
                <span class="icon">📋</span>
                <h2>Utakmice</h2>
                <p>Pregled i uređivanje odigranih utakmica.</p>
            </button>

            <button class="menu-button"
                onclick="openSection('Statistika')">
                <span class="icon">📊</span>
                <h2>Statistika</h2>
                <p>Golovi, nastupi, sedmerci, isključenja i MVP.</p>
            </button>

            <button class="menu-button"
                onclick="openSection('Sezone')">
                <span class="icon">📁</span>
                <h2>Sezone</h2>
                <p>Izbor sezone i istorijska statistika kluba.</p>
            </button>

            <button class="menu-button"
                onclick="openSection('Podešavanja')">
                <span class="icon">⚙️</span>
                <h2>Podešavanja</h2>
                <p>Uvoz, izvoz i rezervne kopije podataka.</p>
            </button>

        </div>

    </main>

    <footer>
        RK Obilić Beograd • Osnovan 1957.
        <br><br>
        Statistički centar | Verzija 0.4
    </footer>

<script src="xlsx.full.min.js"></script>
<script src="database.js"></script>
<script src="app.js"></script>
<script src="match.js"></script>
<script src="import.js"></script>
<script src="settings.js"></script>
<script src="import_matches.js"></script>

<script>
    if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
            navigator.serviceWorker.register("./service-worker.js")
                .then(function (registration) {
                    console.log("Service Worker aktiviran.");
                })
                .catch(function (error) {
                    console.error("Service Worker greška:", error);
                });
        });
    }
</script>

</body>
</html>
